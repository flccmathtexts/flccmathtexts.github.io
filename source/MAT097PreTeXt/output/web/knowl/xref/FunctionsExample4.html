<div class="para">Suppose <span class="process-math">\(f(x)=x^2-3x+1\text{.}\)</span> Find <span class="process-math">\(f(-2)\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#FunctionsExample4-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div> <div class="para logical">
<div class="para">
<span class="process-math">\(f(-2)\)</span> is the result of using <span class="process-math">\(-2\)</span> as an input into this function. So:</div>
<div class="displaymath process-math">
\begin{align*}
f(x) \amp = x^2-3x+1\\
f(-2) \amp = (-2)^2-3(-2)+1\\
\amp = 4+6+1\\
\amp = 11
\end{align*}
</div>
