<div class="para">Simplify <span class="process-math">\((x+2)(x+3)\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#DistributionAlgorithm5-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

<div class="para logical">
<div class="para">We begin by distributing the second expression across the addition in the first:</div>
<div class="displaymath process-math">
\begin{align*}
(x+2)(x+3) \amp = x(x+3)+2(x+3)\\
\amp = x^2+3x+2x+6\\
\amp = x^2+5x+6
\end{align*}
</div>
